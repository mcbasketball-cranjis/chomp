name: Build, test, and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: chomp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            command: dist:win
          - os: macos-15-intel
            platform: mac
            arch: x64
            command: dist:mac
          # The Intel Mac runner builds native x64 and cross-packages arm64.
          # macOS ARM hosted runners have repeatedly failed to acquire a machine.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm test
      - run: pnpm ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      - run: pnpm test:package
      - name: Cross-package Apple Silicon (arm64) on Intel macOS
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Intel macOS DMG architecture and contents
        if: matrix.platform == 'mac'
        run: node scripts/verify-dmg.mjs x64
      - name: Verify Apple Silicon DMG architecture and contents (static; no native execution)
        if: matrix.platform == 'mac'
        run: node scripts/verify-dmg.mjs arm64
      - name: Build previous-version upgrade fixtures
        if: runner.os == 'Windows'
        run: node scripts/build-upgrade-fixtures.mjs
      - name: Test Windows installation and uninstallation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer.ps1
      - name: Verify Windows single-file portable app
        if: runner.os == 'Windows'
        run: node scripts/verify-portable.cjs
      - name: Bundle local signing helpers with Windows downloads
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/package-windows.ps1
      - name: Test local signing and download contents
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/local-signing.ps1
      - name: Scan Windows packages with Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/defender-scan.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*-Setup.exe
            release/*-Portable.exe
            release/Defender-*.json
            release/Defender-*.txt
            release/*.zip
            release/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/*.png
          if-no-files-found: ignore
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

