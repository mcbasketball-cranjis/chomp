name: Build, test, and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: chomp-${{ github.ref }}
  # Do not cancel queued Windows jobs when a new commit is pushed.
  cancel-in-progress: false
jobs:
  prepare-release:
    # Run only for trusted main/tag workflows, never for pull requests.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      skip: ${{ steps.prepare.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or resume an unpublished release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag does not match package version: $GITHUB_REF_NAME vs $tag" >&2
            exit 1
          fi
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            # Previous builds could upload Electron Builder's internal debug YAML.
            # It is not an installer or update feed; keep public downloads clean.
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'builder-debug.yml'; then
              gh release delete-asset "$tag" 'builder-debug.yml' --yes
            fi
            draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [[ "$draft" != "true" ]]; then
              echo "Release $tag is already published. Skipping duplicate build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Resuming draft $tag."
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Chomp $version" --notes-file RELEASE_NOTES.md
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.skip != 'true'
    permissions:
      contents: write
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            command: dist:win
          - os: macos-15-intel
            platform: mac
            arch: x64
            command: dist:mac
          # The Intel Mac runner builds native x64 and cross-packages arm64.
          # macOS ARM hosted runners have repeatedly failed to acquire a machine.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm test
      - name: Build Windows packages
        if: matrix.platform == 'win'
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Select Xcode 26 for the layered macOS icon
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          shopt -s nullglob
          xcodes=(/Applications/Xcode_26*.app)
          if (( ${#xcodes[@]} == 0 )); then
            echo "Xcode 26+ is required for Apple's Icon Composer asset catalog" >&2
            exit 1
          fi
          selected="${xcodes[${#xcodes[@]}-1]}"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
      - name: Build Intel macOS packages (ad-hoc signed)
        if: matrix.platform == 'mac'
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm test:package
      - name: Cross-package Apple Silicon (arm64) on Intel macOS
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Intel macOS DMG architecture and contents
        if: matrix.platform == 'mac'
        run: node scripts/verify-dmg.mjs x64
      - name: Verify Apple Silicon DMG architecture and contents (static; no native execution)
        if: matrix.platform == 'mac'
        run: node scripts/verify-dmg.mjs arm64
      - name: Build previous-version upgrade fixtures
        if: runner.os == 'Windows'
        run: node scripts/build-upgrade-fixtures.mjs
      - name: Test Windows installation and uninstallation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer.ps1
      - name: Verify Windows single-file portable app
        if: runner.os == 'Windows'
        run: node scripts/verify-portable.cjs
      - name: Bundle local signing helpers with Windows downloads
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/package-windows.ps1
      - name: Test local signing and download contents
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/local-signing.ps1
      - name: Scan Windows packages with Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/defender-scan.ps1
      # Direct GitHub Release uploads bypass actions/upload-artifact's failing artifact API.
      # Each asset is uploaded only after packaging and signature/runtime checks pass.
      - name: Upload verified packages to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s nullglob
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            files=(release/*.dmg release/*.zip)
          else
            files=(release/*-Setup.exe release/*-Portable.exe release/*.zip release/latest.yml release/Defender-*.json release/Defender-*.txt)
          fi
          if (( ${#files[@]} == 0 )); then
            echo "No distributable packages found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty package: $file" >&2
              exit 1
            fi
            echo "::group::Upload $(basename "$file")"
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$file" --clobber; then
                uploaded=true
                break
              fi
              echo "::warning::Upload attempt $attempt failed for $(basename "$file")"
              sleep $((attempt * 10))
            done
            if [[ "$uploaded" != "true" ]]; then
              echo "Failed to upload package after retries: $file" >&2
              exit 1
            fi
            echo "::endgroup::"
          done
  release:
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The release stays a draft until every expected Mac/Windows asset exists.
      - name: Verify all package uploads and publish Chomp
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  update-smoke:
    # Only after 2.1.1 is published: verify the ACTUAL 2.1.0 Windows
    # installer detects and downloads 2.1.1 from GitHub Releases.
    needs: release
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Download the real published 2.1.0 NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path previous-release | Out-Null
          gh release download v2.1.0 --pattern 'Chomp-2.1.0-win-x64-Setup.exe' --dir previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Chomp 2.1.0' }
      - name: Install 2.1.0 into runner temp
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'previous-release/Chomp-2.1.0-win-x64-Setup.exe').Path
          $destination = Join-Path $env:RUNNER_TEMP 'Chomp-update-from-2.1.0'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "2.1.0 install failed: $($process.ExitCode)" }
          $executable = Join-Path $destination 'Chomp.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw 'Installed 2.1.0 executable not found' }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'Uninstall Chomp.exe'))) { throw 'Not an NSIS installation' }
          "CHOMP_PREVIOUS_EXE=$executable" >> $env:GITHUB_ENV
      - name: Run real published update check and SHA-512 verified download
        run: node tests/release-update-smoke.cjs
