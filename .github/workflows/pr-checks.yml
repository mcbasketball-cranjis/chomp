name: Pull request checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node node_modules/electron/install.js
      - run: xvfb-run --auto-servernum pnpm test:vector
      - run: xvfb-run --auto-servernum pnpm test:desktop
      - run: xvfb-run --auto-servernum pnpm test:folders
      - run: xvfb-run --auto-servernum pnpm test:appearance

  mac-icon:
    runs-on: macos-15-intel
    timeout-minutes: 40
    # Only ad-hoc signing: no Apple Developer credentials or signing secrets in PR jobs.
    env:
      CSC_FOR_PULL_REQUEST: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select Xcode 26
        shell: bash
        run: |
          shopt -s nullglob
          xcodes=(/Applications/Xcode_26*.app)
          if (( ${#xcodes[@]} == 0 )); then
            echo "Xcode 26 is required for Apple Icon Composer" >&2
            exit 1
          fi
          selected="${xcodes[${#xcodes[@]}-1]}"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Build and verify Intel Mac package with native layered icon
        run: |
          pnpm dist:mac
          node scripts/verify-dmg.mjs x64
          node scripts/test-mac-updater.mjs
      - name: Cross-build and verify Apple Silicon package with native layered icon
        run: |
          pnpm exec electron-builder --mac dmg zip --arm64 --publish never
          node scripts/verify-dmg.mjs arm64

  windows-updater:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Build and validate native MSIX with disposable CI identity
        run: |
          pnpm build
          pnpm exec electron-builder --win --x64 --dir --publish never
          node scripts/build-store-msix.mjs --ci-fixture
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build NSIS and portable packages with update metadata
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged desktop, update feed and checksum metadata
        run: pnpm test:package
